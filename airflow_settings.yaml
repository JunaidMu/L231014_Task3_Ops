# This file allows you to configure Airflow Connections, Pools, and Variables in a single place for local development only.
# NOTE:elt/etl connections configured for MongoDB and Frankfurter API.

airflow:
  connections:
    - conn_id: mongo_default
      conn_type: mongo
      conn_host: mongodb
      conn_schema: currency_exchange_db
      conn_login: admin
      conn_password: password
      conn_port: 27017
      conn_extra: '{"authSource": "admin"}'
    - conn_id: frankfurter_api
      conn_type: http
      conn_host: https://api.frankfurter.dev
      conn_schema: https
  pools: []
  variables: []
